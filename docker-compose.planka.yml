version: '3.5'\nservices:\n  planka:\n    image: lscr.io/linuxserver/planka:latest\n    environment:\n      - BASE_URL=https://tracker.vaborin.com\n      - DATABASE_URL=postgres://planka:${DB_PASSWORD}@db/planka\n      - SECRET_KEY=${SECRET_KEY}\n    ports:\n      - "3000:3000"\n    depends_on:\n      - db\n    restart: always\n    volumes:\n      - planka_data:/data\n    networks:\n      - planka-network\n  \n  db:\n    image: postgres:alpine\n    environment:\n      - POSTGRES_DB=planka\n      - POSTGRES_USER=planka\n      - POSTGRES_PASSWORD=${DB_PASSWORD}\n    volumes:\n      - db_data:/var/lib/postgresql/data\n    networks:\n      - planka-network\n    restart: always\n\nvolumes:\n  db_data:\n  planka_data:\n\nnets:\n  planka-network:\n    driver: bridge