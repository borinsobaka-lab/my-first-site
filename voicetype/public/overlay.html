<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceType Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .overlay {
      background: rgba(30, 30, 35, 0.95);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-container {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-container.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .icon-container.processing {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      animation: spin 2s linear infinite;
    }

    .icon-container.error {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }

    .icon-container svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .hotkey {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
    }

    .error-message {
      font-size: 12px;
      color: #fca5a5;
      margin-top: 4px;
      word-break: break-word;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="icon-container recording" id="icon">
      <!-- Microphone icon for recording -->
      <svg id="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <!-- Spinner icon for processing -->
      <svg id="spinner-icon" class="hidden" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93s3.05-7.44 7-7.93v2.02c-2.84.48-5 2.94-5 5.91s2.16 5.43 5 5.91v2.02zm2 0v-2.02c2.84-.48 5-2.94 5-5.91s-2.16-5.43-5-5.91V4.07c3.94.49 7 3.85 7 7.93s-3.06 7.44-7 7.93z"/>
      </svg>
      <!-- Error icon -->
      <svg id="error-icon" class="hidden" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <div class="content">
      <div class="title" id="title">Запись...</div>
      <div class="subtitle" id="subtitle">
        Нажмите <span class="hotkey" id="hotkey">Ctrl+Shift+Space</span> для остановки
      </div>
      <div class="error-message hidden" id="error-message"></div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const hotkey = document.getElementById('hotkey');
    const errorMessage = document.getElementById('error-message');
    const micIcon = document.getElementById('mic-icon');
    const spinnerIcon = document.getElementById('spinner-icon');
    const errorIcon = document.getElementById('error-icon');

    function updateState(state, hotkeyStr) {
      // Reset all icons
      micIcon.classList.add('hidden');
      spinnerIcon.classList.add('hidden');
      errorIcon.classList.add('hidden');
      errorMessage.classList.add('hidden');

      // Update hotkey display
      if (hotkeyStr) {
        hotkey.textContent = hotkeyStr;
      }

      // Update based on state
      icon.className = 'icon-container';

      switch (state) {
        case 'recording':
          icon.classList.add('recording');
          micIcon.classList.remove('hidden');
          title.textContent = 'Запись...';
          subtitle.classList.remove('hidden');
          subtitle.innerHTML = 'Нажмите <span class="hotkey">' + hotkey.textContent + '</span> для остановки';
          break;

        case 'processing':
          icon.classList.add('processing');
          spinnerIcon.classList.remove('hidden');
          title.textContent = 'Обработка...';
          subtitle.classList.remove('hidden');
          subtitle.textContent = 'Распознавание речи';
          break;

        case 'error':
          icon.classList.add('error');
          errorIcon.classList.remove('hidden');
          title.textContent = 'Ошибка';
          subtitle.classList.add('hidden');
          break;

        default:
          // idle - hide
          break;
      }
    }

    function showError(message) {
      updateState('error');
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    // Initialize
    if (window.overlayAPI) {
      // Get initial state
      window.overlayAPI.getState().then(({ state, hotkey: hk }) => {
        updateState(state, hk);
      });

      // Listen for state changes
      window.overlayAPI.onStateChanged(({ state, hotkey: hk }) => {
        updateState(state, hk);
      });

      // Listen for errors
      window.overlayAPI.onError(({ message }) => {
        showError(message);
      });
    }
  </script>
</body>
</html>
